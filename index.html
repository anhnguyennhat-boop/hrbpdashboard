<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disciplinary Case Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- PapaParse CDN (5.4.1) included above -->
</head>
<body>
  <div id="debug-log-panel" style="background:#111; color:#fff; border:2px solid #ff5722; padding:15px; font-family:monospace; font-size:12px; margin:20px; max-height:250px; overflow-y:auto; border-radius:8px;">
    <h3 style="color:#ff5722; margin-top:0;">⚠️ Live Debug Console (Errors will show here):</h3>
    <div id="debug-log-content"></div>
  </div>
  <script>
    (function() {
      const content = document.getElementById('debug-log-content');
      function logToScreen(msg, color = '#fff') {
        const p = document.createElement('p');
        p.style.color = color;
        p.style.margin = '4px 0';
        p.style.borderBottom = '1px solid #222';
        p.style.paddingBottom = '2px';
        p.textContent = msg;
        content.appendChild(p);
      }
      
      // Intercept console.log
      const orgLog = console.log;
      console.log = function(...args) {
        orgLog.apply(console, args);
        logToScreen('[LOG] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), '#64b5f6');
      };

      // Intercept console.error
      const orgError = console.error;
      console.error = function(...args) {
        orgError.apply(console, args);
        logToScreen('[ERROR] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), '#e57373');
      };

      window.addEventListener('error', function(e) {
        logToScreen('[CRASH] ' + e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno, '#f44336');
      });

      window.addEventListener('unhandledrejection', function(e) {
        logToScreen('[REJECTION] ' + e.reason + (e.reason && e.reason.stack ? '\n' + e.reason.stack : ''), '#ffb74d');
      });
    })();
  </script>
  <header class="header">
    <h1>Disciplinary Case Tracking Dashboard</h1>
  </header>
  <main class="container">
    <aside class="sidebar" id="filters">
      <h2>Filters</h2>
      <div class="filter-group" id="filter-area"></div>
      <div class="filter-group" id="filter-dept"></div>
      <div class="filter-group" id="filter-designation"></div>
      <div class="filter-group" id="filter-severity"></div>
      <div class="filter-group" id="filter-status"></div>
    </aside>
    <section class="content">
      <section class="kpi-cards" id="kpi-cards"></section>
      <section class="table-section">
        <table id="cases-table">
          <thead>
            <tr>
              <th>Case ID</th>
              <th>Employee</th>
              <th>Violation</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Last Action</th>
              <th>Next Follow‑Up</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section class="charts" id="charts">
        <div class="chart-container"><canvas id="trendChart"></canvas></div>
        <div class="chart-container"><canvas id="severityChart"></canvas></div>
        <div class="chart-container"><canvas id="categoryChart"></canvas></div>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disciplinary Case Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- PapaParse CDN (5.4.1) included above -->
</head>
<body>
  <header class="header">
    <h1>Disciplinary Case Tracking Dashboard</h1>
  </header>
  <main class="container">
    <aside class="sidebar" id="filters">
      <h2>Filters</h2>
      <div class="filter-group" id="filter-area"></div>
      <div class="filter-group" id="filter-dept"></div>
      <div class="filter-group" id="filter-designation"></div>
      <div class="filter-group" id="filter-severity"></div>
      <div class="filter-group" id="filter-status"></div>
    </aside>
    <section class="content">
      <section class="kpi-cards" id="kpi-cards"></section>
      <section class="table-section">
        <table id="cases-table">
          <thead>
            <tr>
              <th>Case ID</th>
              <th>Employee</th>
              <th>Violation</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Last Action</th>
              <th>Next Follow‑Up</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section class="charts" id="charts">
        <canvas id="trendChart"></canvas>
        <canvas id="severityChart"></canvas>
        <canvas id="categoryChart"></canvas>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
